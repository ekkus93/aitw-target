# Deployment manifest for the defended agent deployment.
#
# Conservative, conventional fields. The provider entrypoint is an importable module + class; the
# commands are ordinary install/test/run lines. If an external intake supplies an exact manifest
# schema, update these fields to match it.

name: agent-deployment
version: 2

# This package is a defense layer loaded ON TOP OF a host-provided agent runtime; it is not a
# standalone agent system. The host environment must provide the runtime as an importable Python
# package (named ``aitw`` here, a functional dependency name only). The provider package itself
# carries no condition/methodology labels.
runtime:
  mode: host_plugin
  requires_host_package: aitw
  python: ">=3.10"
  external_effects: mocked

provider:
  module: agent_deployment.provider
  class: AgentDeployment
  entrypoint: agent_deployment.provider:AgentDeployment

commands:
  install: 'pip install -e ".[dev]"'
  test: 'python -m pytest -q'
  run: 'python -m agent_deployment.run_local --scenario support_triage'
  reset: 'python -m agent_deployment.reset'

capabilities:
  - enforced_tool_policy
  - tenant_scoped_memory
  - context_provenance_sanitization
  - external_effect_validation
  - operational_bulletin
  - scanner_redaction

bulletin:
  schema: schemas/operational_bulletin.schema.json
  interface: read_operational_bulletin

telemetry:
  format: jsonl

artifacts:
  include:
    - deployment.yaml
    - schemas/operational_bulletin.schema.json
    - src/agent_deployment/**
