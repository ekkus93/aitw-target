[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-in-the-wild"
version = "0.1.0"
description = "Deliberately-naive multi-tenant multi-agent target system for an authorized research event"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",          # FastAPI TestClient
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Boring, install-free test runs: put the package on the path directly.
pythonpath = ["src"]
testpaths = ["tests"]
